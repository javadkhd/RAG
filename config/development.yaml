app:
  name: "RAG Platform"
  version: "0.1.0"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000
  reload: true

database:
  url: "postgresql+asyncpg://rag:ragpass@postgres:5432/ragdb"
  echo: true
  pool_size: 5
  max_overflow: 10

redis:
  url: "redis://redis:6379/0"

celery:
  broker_url: "redis://redis:6379/1"
  result_backend: "redis://redis:6379/2"

llm:
  provider: "ollama"
  # model: "llama3" 
  model: "phi3:3.8b-mini-128k-instruct-q2_K" #"llama3:8b-q4_K_M" # or mistral:7b-q4_K_M, qwen2:7b-q4_K_M
  base_url: "http://ollama:11434"
  temperature: 0.1
  max_tokens: 4096

embedding:
  provider: "bge_m3"
  model_name: "BAAI/bge-m3"
  device: "cpu"
  normalize: true

retrieval:
  dense_weight: 0.6
  bm25_weight: 0.4
  top_k: 10
  rerank_top_k: 5
  similarity_threshold: 0.7

ingestion:
  chunk_size: 512
  chunk_overlap: 50
  max_workers: 4

storage:
  upload_dir: "./storage/uploads"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
