app:
  name: "RAG Platform"
  version: "0.1.0"
  debug: true

server:
  host: "0.0.0.0"
  port: 8000
  reload: true

database:
  url: "postgresql+asyncpg://rag:ragpass@localhost:5432/ragdb"
  echo: true
  hide_parameters: true
  pool_size: 5
  max_overflow: 10

redis:
  url: "redis://redis:6379/0"

celery:
  broker_url: "redis://redis:6379/1"
  result_backend: "redis://redis:6379/2"

llm:
  provider: "ollama"
  # model: "llama3" 
  model: "qwen2.5:0.5b" # phi3:3.8b-mini-128k-instruct-q2_K, llama3:8b-q4_K_M, mistral:7b-q4_K_M, qwen2:7b-q4_K_M
  base_url: "http://ollama:11434"
  temperature: 0.1
  max_tokens: 4096
  request_timeout: 120.0

embedding:
  provider: "bge_m3"
  model_name: "BAAI/bge-m3"
  base_url: "http://localhost:11434"
  device: "cpu"
  normalize: true
  request_timeout: 60.0

retrieval:
  dense_weight: 0.6
  bm25_weight: 0.4
  top_k: 10
  rerank_top_k: 5
  similarity_threshold: 0.7

reranker:
  cross_encoder_model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

ingestion:
  chunk_size: 512
  chunk_overlap: 50
  max_workers: 4
  default_doc_path: "data/docs"

api:
  cors_origins: ["*"]
  rate_limit_max_requests: 100
  rate_limit_window_seconds: 60
  health_check_timeout: 2.0

worker:
  worker_prefetch_multiplier: 1
  task_time_limit: 1800
  task_soft_time_limit: 1740
  concurrency: 1
  loglevel: "info"

storage:
  upload_dir: "./storage/uploads"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
